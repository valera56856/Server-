name: Publish NextCRM preview

on:
  push:
    branches: [master]
    paths:
      - "preview-payload/**"
      - ".github/workflows/publish-nextcrm-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextcrm-preview-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Rebuild and verify static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nextcrm-public
          mkdir -p /tmp/nextcrm-public
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import glob
          import hashlib
          import re

          expected = "8c236be42f51470397cbdf59e760c8f6bc13c19cad852802fcbe54ac0ff56126"
          parts = sorted(glob.glob("preview-payload/part-*.b64"))
          if len(parts) != 7:
              raise SystemExit(f"Expected 7 payload parts, found {len(parts)}")

          chunks = []
          for path in parts:
              text = Path(path).read_text(encoding="utf-8-sig")
              clean = re.sub(r"[^A-Za-z0-9+/=]", "", text)
              print(f"{path}: source={len(text)} clean={len(clean)}")
              if len(clean) % 4:
                  raise SystemExit(f"Invalid Base64 length in {path}: {len(clean)}")
              chunks.append(clean)

          encoded = "".join(chunks)
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          print(f"decoded={len(raw)} sha256={actual}")
          if actual != expected:
              raise SystemExit(f"Payload checksum mismatch: expected {expected}, got {actual}")
          Path("/tmp/nextcrm-preview.zip").write_bytes(raw)
          PY
          unzip -q /tmp/nextcrm-preview.zip -d /tmp/nextcrm-public
          touch /tmp/nextcrm-public/.nojekyll
          printf '%s\n' "Published from ${GITHUB_SHA}" > /tmp/nextcrm-public/PREVIEW_BUILD.txt
          test -f /tmp/nextcrm-public/index.html
          test -f /tmp/nextcrm-public/product.html
          test -f /tmp/nextcrm-public/pricing.html
          test -f /tmp/nextcrm-public/assets/styles.css
          test -f /tmp/nextcrm-public/assets/app.js

      - name: Publish isolated gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/nextcrm-public
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish NextCRM live preview from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
