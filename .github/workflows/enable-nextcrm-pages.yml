name: Enable NextCRM GitHub Pages preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/enable-nextcrm-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nextcrm-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published preview
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
